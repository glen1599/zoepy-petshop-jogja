<!DOCTYPE html>
<html lang="id" class="no-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Zoepy Petshop Jogja</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d0e0e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0e0e'/%3E%3Cpath d='M16 25c-5 0-8-3.4-8-8 0-5.2 4-9.6 8-12 4 2.4 8 6.8 8 12 0 4.6-3 8-8 8z' fill='%23d2ff00'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/zoepy.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">

<!-- ===================== LOGIN ===================== -->
<div class="gate" id="gate">
  <div class="gate__card">
    <a class="wordmark" href="index.html">Zoepy<b>.</b><small>Admin</small></a>
    <h1 class="display">Masuk</h1>
    <p class="gate__note" id="gate-note">Panel admin Zoepy Petshop Jogja.</p>

    <form class="gate__form" id="login-form">
      <label>
        <span>Email</span>
        <input type="email" name="email" autocomplete="username" required>
      </label>
      <label>
        <span>Kata sandi</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button class="btn" type="submit"><span>Masuk</span></button>
      <p class="gate__error" id="login-error" role="alert" hidden></p>
    </form>

    <p class="gate__foot">
      <a href="index.html">← Kembali ke situs</a>
      <span class="badge-mode" id="mode-badge-login">memuat…</span>
    </p>
  </div>
</div>

<!-- ===================== PANEL ===================== -->
<div class="panel" id="panel" hidden>
  <aside class="side">
    <a class="wordmark side__brand" href="index.html">Zoepy<b>.</b></a>
    <nav class="side__nav" id="side-nav" aria-label="Bagian admin"></nav>
    <div class="side__foot">
      <span class="badge-mode" id="mode-badge">memuat…</span>
      <button class="side__link" id="btn-reset" type="button" hidden>Reset data demo</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 class="display" id="view-title">Ringkasan</h1>
        <p class="topbar__sub" id="view-sub">—</p>
      </div>
      <div class="topbar__right">
        <input class="search" id="search" type="search" placeholder="Cari…" aria-label="Cari">
        <button class="btn" id="btn-new" type="button" hidden><span>Tambah</span></button>
        <span class="who" id="who">&nbsp;</span>
        <button class="btn btn--outline" id="btn-logout" type="button"><span>Keluar</span></button>
      </div>
    </header>

    <div class="stats" id="stats"></div>

    <div class="table-wrap">
      <table class="data" id="table">
        <thead id="table-head"></thead>
        <tbody id="table-body"></tbody>
      </table>
      <p class="empty" id="empty" hidden>Belum ada data.</p>
    </div>
  </main>
</div>

<!-- ===================== MODAL ===================== -->
<div class="modal" id="modal" hidden>
  <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="modal__head">
      <h2 class="display" id="modal-title">Ubah</h2>
      <button class="modal__close" id="modal-close" type="button" aria-label="Tutup">✕</button>
    </header>
    <form class="modal__form" id="modal-form"></form>
    <footer class="modal__foot">
      <button class="btn btn--outline" id="modal-cancel" type="button"><span>Batal</span></button>
      <button class="btn" id="modal-save" type="submit" form="modal-form"><span>Simpan</span></button>
    </footer>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="js/config.js" defer></script>
<script src="js/data.js" defer></script>
<script src="js/admin.js" defer></script>
</body>
</html>
